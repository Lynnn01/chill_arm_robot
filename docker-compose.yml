version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # --------------------------------------------------------
    # หมายเหตุ: หากรันบน Jetson/Linux ที่มี NVIDIA GPU
    # ให้เอาคอมเมนต์ ( # ) ด้านล่างนี้ออก เพื่อเปิดใช้ GPU Acceleration
    # --------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:
